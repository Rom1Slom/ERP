{% extends 'habilitations_app/base.html' %}
{% block title %}Inscrire {{ stagiaire.nom }} à une session{% endblock %}
{% block page_content %}
<div class="container mt-4">
    <h2>Inscrire {{ stagiaire.nom }} {{ stagiaire.prenom }} à une session</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="session_id" class="form-label">Choisir une session</label>
            <select name="session_id" id="session_id" class="form-select" required>
                {% for session in sessions %}
                <option value="{{ session.id }}">
                    {{ session.numero_session }} - {{ session.habilitation.nom }} ({{ session.date_debut|date:"d/m/Y" }} au {{ session.date_fin|date:"d/m/Y" }})
                </option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-success">Inscrire</button>
        <a href="{% url 'stagiaire_list' %}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
